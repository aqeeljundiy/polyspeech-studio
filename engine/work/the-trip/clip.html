<style>

</style></head><body>
<div id="stage">
  <div class="glow" id="g1" style="width:900px;height:900px;background:#CFE0FF"></div>
  <div class="glow" id="g2" style="width:760px;height:760px;background:#E8FFB0"></div>
  <div class="glow" id="g3" style="width:620px;height:620px;background:#DCE7FF"></div>

  <div class="real" id="hook">
    <div class="pass" id="pass">
      <div class="top"><div><div style="font-size:26px;font-weight:600;opacity:.8;letter-spacing:3px">BOARDING PASS</div><div style="font-size:44px;font-weight:800;margin-top:6px">SFO → PVG</div></div><div id="planeIc"></div></div>
      <div style="padding:44px">
        <div style="font-size:26px;font-weight:700;letter-spacing:3px;color:#9A9EA8">DESTINATION</div>
        <div style="font-size:84px;font-weight:800;letter-spacing:-3px;line-height:1">Shanghai</div>
        <div style="margin-top:34px;display:flex;align-items:baseline;gap:22px"><div style="font-size:26px;font-weight:700;letter-spacing:3px;color:#9A9EA8">DEPARTS IN</div><div style="font-size:150px;font-weight:800;letter-spacing:-6px;line-height:1;color:#2563EB" id="days">14</div><div style="font-size:46px;font-weight:800">days</div></div>
      </div>
    </div>
  </div>

  <div class="real" id="cafe">
    <div class="bubW" id="w1" style="top:640px"><div class="who"><div class="av" id="chefIc"></div>Waiter</div>
      <div id="w1zh" style="font-size:70px;font-weight:700;margin-top:26px;line-height:1.2">欢迎光临！几位？</div>
      <div id="w1tr" style="font-size:32px;color:#9A9EA8;margin-top:10px">Huānyíng guānglín! Jǐ wèi?</div>
      <div id="w1en" style="font-size:34px;color:#5C6170;margin-top:4px">Welcome! How many of you?</div></div>
    <div class="bubU" id="u1" style="top:1170px"><div id="u1zh" style="font-size:58px;font-weight:700;line-height:1.25"></div><div id="u1sub" style="font-size:32px;opacity:.85;margin-top:10px"></div><i id="caret" style="display:inline-block;width:7px;height:66px;background:#fff;border-radius:3px;vertical-align:middle"></i></div>
    <div id="day14" style="position:absolute;left:50%;top:460px;transform:translateX(-50%);height:124px;padding:0 56px;border-radius:62px;background:#12141A;color:#fff;font-size:56px;font-weight:800;display:flex;align-items:center;gap:20px;white-space:nowrap"><span id="calIc" style="display:flex;width:54px;height:54px"></span><span style="line-height:1">DAY 14</span></div>
  </div>
  <div id="vig"></div>
  <div id="wipe"></div>
  <img id="burstMas" src="../../kit/mascot.png" style="position:absolute;left:290px;top:780px;width:500px;height:500px">

  <div id="persp"><div id="cam"><div id="phoneWrap"></div></div></div>

  <div id="scrim" style="position:absolute;left:0;right:0;top:0;height:560px;background:linear-gradient(180deg,#EEF2FC 0%,#EEF2FC 64%,rgba(238,242,252,0) 100%);pointer-events:none"></div>
  <div class="layer" id="caps"></div>
  <div class="tap" id="tap"></div><div class="tapr" id="tapr"></div>
  <div class="layer" id="endL">
    <img id="endMas" src="../../kit/mascot.png" style="position:absolute;left:350px;top:520px;width:380px;height:380px">
    <div id="word" style="position:absolute;left:0;right:0;top:950px;text-align:center;font-size:132px;font-weight:800;letter-spacing:-6px"></div>
    <div id="pillw" style="position:absolute;left:50%;top:1130px;height:92px;border-radius:46px;padding:3px;overflow:hidden;box-shadow:0 18px 50px -10px rgba(37,99,235,.4)"><div id="pillbg" style="position:absolute;left:50%;top:50%;width:1000px;height:1000px;margin:-500px 0 0 -500px;background:conic-gradient(#2563EB,#B5F000,#F04070,#EAF1FE,#2563EB)"></div><div style="position:relative;height:86px;border-radius:43px;background:#fff;padding:0 44px;display:flex;align-items:center;font-size:34px;font-weight:700;white-space:nowrap">Speak a new language with confidence</div></div>
    <div id="cta" style="position:absolute;left:50%;top:1270px;height:116px;padding:0 70px;border-radius:58px;background:#2563EB;color:#fff;font-size:44px;font-weight:800;display:flex;align-items:center;gap:16px;white-space:nowrap;box-shadow:0 26px 50px -14px rgba(37,99,235,.6)">Start speaking free →</div>
    <div id="badges" class="row" style="position:absolute;left:0;right:0;top:1430px;justify-content:center;gap:24px"><img src="../../kit/brand/appstore-badge.svg" style="height:100px;display:block"><img src="../../kit/brand/googleplay-badge.svg" style="height:100px;display:block"></div></div>
  </div>
</div>
<script src="../../kit/lucide.min.js"></script>
<script src="../../kit/kit.js"></script>
<script>
const {p,E,set,show,$,$$,cl,lerp,bump,ic,mascot}=K;
const TASKS=[{kind:'lesson',title:'Menu words'},{kind:'lesson',title:'Polite requests'},{kind:'lesson',title:'Asking about dishes'},{kind:'chat',title:'Order at a restaurant'},{kind:'lesson',title:'Paying and saying thanks'},{kind:'chat',title:'A full dinner, no help'}];
$('#phoneWrap').innerHTML=K.device('dev',`
 <div class="layer" id="sHome">${K.home({greet:'Good morning, Maya!',eyebrow:'READY WHEN YOU ARE',heroTitle:'What shall we practice?',heroSub:'',streak:0,week:0,saved:0,plans:[]})}${K.tabBar('home')}</div>
 <div class="layer" id="sGoal"></div>
 <div class="layer" id="sReview">${K.goalReview({goal:'Order dinner in Shanghai',tasks:TASKS})}</div>
 <div class="layer" id="sLesson"><div class="scroll" style="padding-bottom:0">
   ${K.lessonHeader({title:'Menu words',progress:['cur','none','none'],idx:1,total:3})}${K.answerSwitch('Speak')}
   <div style="margin-top:10px" id="lsItem">${K.tutorTurn(K.lessonItem({kind:'PHRASE',teach:'Pointing at the menu? Say this. The first word means "I", the next "want", and the last two mean "this one". Try it now.',words:[{w:'我',r:'wǒ'},{w:'要',r:'yào'},{w:'这个',r:'zhège'}],english:'I want this one.',karaokeId:'kar1'}),{mood:'happy',active:true,mascotId:'lsMas'})}</div>
 </div>${K.micDock({step:'REPEAT AFTER ME',hint:'Listen to your tutor...',menu:false,id:'lsDock'})}
   <div class="layer" id="sWord" style="z-index:30">${K.wordSheet({word:'这个',reading:'zhè ge',tones:[{s:'zhè',t:'Tone 4 · falling'},{s:'ge',t:'Tone 0 · light and short'}],meaning:'this one',breakdown:[{part:'这',r:'zhè',e:'this'},{part:'个',r:'ge',e:'(one)'}],literal:'this one',usage:'Point and say it to pick something. 那个 (that one) works the same way.',example:{t:'我要这个。',r:'wǒ yào zhè ge.',e:'I want this one.'}})}</div>
 </div>
 <div class="layer" id="sRole"><div class="scroll" style="padding-bottom:0">
   ${K.roleplayHeader({title:'Order at a Restaurant',ex:1,total:3,who:'Waiter'})}
   </div><div style="position:absolute;left:16px;right:16px;top:182px;bottom:170px;overflow:hidden"><div id="rpFeed" style="position:relative;padding-top:4px;display:flex;flex-direction:column;gap:16px">
     <div id="rpW1">${K.charTurn({text:'您想吃点什么？',tr:'Nín xiǎng chī diǎn shénme?',en:'What would you like to eat?',vocab:['吃 (chī) — eat','什么 (shénme) — what']})}</div>
     <div id="rpL1">${K.learner({text:'我可以要一个饺子吗？',tr:'Wǒ kěyǐ yào yí ge jiǎozi ma?',en:'Can I get one dumpling?',footer:'fix',fix:{text:'我可以要一份饺子吗？',tr:'Wǒ kěyǐ yào yí fèn jiǎozi ma?',en:'Can I get a plate of dumplings?'}})}</div>
   </div></div>
   ${K.micDock({hint:'Your turn — record your response.',menu:true,id:'rpDock'})}
   ${K.helpModal({id:'rpHelp',result:{text:'我可以要饺子吗？',tr:'Wǒ kěyǐ yào jiǎozi ma?',en:'Can I get the dumplings?'}})}
 </div>`);
$('#planeIc').innerHTML=ic('plane',84,'#fff',1.8); $('#chefIc').innerHTML=ic('chef-hat',42,'#B45309',1.8);
$('#calIc').innerHTML=ic('calendar-check',54,'#B5F000',2.2);
$('#word').innerHTML=[...'Polyspeech'].map(c=>`<span style="display:inline-block">${c}</span>`).join('');
K.icons(); K.preloadGlyphs('我可以要一份饺子吗？您想吃点什么');
const dev=$('#dev'), cam=$('#cam'), L=id=>$('#'+id);

// ---- captions: ≤7 words, held 1.5s + 0.4s/word or longer ----
const CAPS=[
 {a:.8,b:4.4,html:'14 days until | <b>Shanghai.</b>'},
 {a:7.4,b:11.4,html:'And I can\'t even | <b>order dinner.</b>'},
 {a:12.6,b:15.8,html:'Tell it <b>your goal.</b>'},
 {a:17.6,b:21.0,html:'It plans | <b>every step.</b>'},
 {a:22.2,b:26.6,html:'Learn the words | you\'ll <b>actually need.</b>'},
 {a:30.4,b:33.8,html:'Every word, | <b>explained.</b>'},
 {a:37.0,b:40.6,html:'Stuck? Say it | in <b>English.</b>'},
 {a:41.4,b:44.8,html:'Get the <b>Mandarin</b> back.'},
 {a:49.2,b:52.9,html:'Mistakes fixed | <b>on the spot.</b>'},
 {a:53.9,b:57.2,html:'Day 14. | Dinner, <b>ordered.</b>'},
];
CAPS.forEach((c,i)=>{CAPS[i]=K.caption(L('caps'),{...c,style:{left:'50px',right:'50px',top:'230px',fontSize:'80px'}});});

// ---- camera keyframes: [t, scale, focusX, focusY, stageY]; moves only between beats ----
const KF=[[0,1.75,187,406,1170],[13.0,1.75,187,406,1170],[14.2,2.2,187,640,1180],[17.7,2.0,187,620,1190],[21.0,1.75,187,406,1170],[21.6,2.35,187,380,1150],
          [29.2,2.05,187,470,1180],[35.8,1.75,187,406,1170],[38.1,2.1,187,360,1150],[45.0,1.75,187,406,1170],[48.7,2.1,187,420,1170]];
// at each keyframe time, ease from the previous framing to this one over 0.8s
function camAt(t){let i=0;while(i<KF.length-1&&KF[i+1][0]<=t)i++;const b=KF[i],a=KF[Math.max(0,i-1)];
  const q=E.inOut(cl((t-b[0])/.8));return b.slice(1).map((v,k)=>lerp(a[k+1],v,q));}
const lsDock=L('lsDock'), rpDock=L('rpDock'), karSpans=$$('#kar1 span');

// v2 retime: clock time T -> beat time t. Holds the 14 (5.8) and the waiter bubble (6.9) 0.5s each,
// and cuts 1.0s of idle lesson time (27.0–28.0). Cue times in clip.json use clock time.
const WARP=[[0,0],[5.8,5.8],[6.3,5.8],[7.4,6.9],[7.9,6.9],[28.0,27.0]];
function warp(T){if(T>=28.0)return T;let i=0;while(i<WARP.length-1&&WARP[i+1][0]<=T)i++;
  const a=WARP[i],b=WARP[i+1];return a[1]+(T-a[0])*((b[1]-a[1])/(b[0]-a[0]));}
function render(T){
  const t=warp(T);
  set(L('g1'),{left:(-260+Math.sin(T*.4)*80)+'px',top:(-160+Math.cos(T*.3)*60)+'px',opacity:.75});
  set(L('g2'),{left:(480+Math.cos(T*.35)*80)+'px',top:(1300+Math.sin(T*.45)*70)+'px',opacity:.6});
  set(L('g3'),{left:(560+Math.sin(T*.5)*60)+'px',top:(260+Math.sin(T*.3)*90)+'px',opacity:.5});

  // 1. HOOK 0–6
  const hookOn=t<6.4; show(L('hook'),hookOn);
  if(hookOn){const q=p(t,0,.8,E.back), out=p(t,5.8,6.35,E.inExpo);
    set(L('pass'),{transform:`perspective(1600px) rotateX(${lerp(60,4,q)+Math.sin(T*1.1)*1.5}deg) rotateY(${-5+Math.sin(T*.8)*2.5}deg) translateY(${(1-q)*300-out*200}px) scale(${lerp(.7,1,q)*(1+out*.4)})`,opacity:cl(t/.25)*(1-out),filter:`blur(${out*18}px)`});
    L('days').textContent=String(Math.max(14,Math.round(lerp(30,14,p(t,.4,2.0,E.out)))));}
  // 2. FREEZE 6–12, 8. PAYOFF 53–57
  const cafe=L('cafe'), pay=t>=53.0;
  show(cafe,(t>6.0&&t<12.3)||(t>53.0&&t<57.3));
  if(!pay){
    const w=p(t,6.2,6.7,E.back); set(L('w1'),{transform:`translateY(${(1-w)*-120}px) scale(${lerp(1.15,1,w)})`,opacity:cl((t-6.2)/.15),filter:`blur(${(1-p(t,6.2,6.6))*14}px)`});
    const u=p(t,6.9,7.3,E.back), amp=lerp(0,9,p(t,10.0,11.7,E.lin));
    set(L('u1'),{transform:`translateY(${(1-u)*80}px) translateX(${Math.sin(t*70)*amp}px)`,opacity:cl((t-6.9)/.15)});
    L('u1zh').textContent=''; L('u1sub').textContent=''; L('caret').style.opacity=(Math.floor(t*2.4)%2?.15:1);
    set(cafe,{transform:`scale(${1+p(t,9.8,11.9,E.inOut)*.12})`,transformOrigin:'600px 1260px',filter:`grayscale(${p(t,10.0,11.6,E.lin)*.3})`});
    show(L('day14'),false); L('vig').style.opacity=t<11.9?p(t,9.6,11.6,E.lin)*.55:0;
  } else {
    L('vig').style.opacity=0;
    set(cafe,{transform:`translateY(${(1-p(t,53.0,53.6))*900}px) scale(${1+p(t,56.9,57.3,E.inExpo)*.35})`,filter:`blur(${(1-p(t,53.0,53.4))*18+p(t,56.9,57.3,E.inExpo)*22}px)`,opacity:1-p(t,57.0,57.3)});
    show(L('day14'),true); set(L('day14'),{transform:`translateX(-50%) scale(${p(t,53.3,53.7,E.back)})`});
    L('w1zh').textContent='您想吃点什么？'; L('w1tr').textContent='Nín xiǎng chī diǎn shénme?'; L('w1en').textContent='What would you like to eat?';
    set(L('w1'),{transform:'none',opacity:1,filter:'none'}); set(L('u1'),{transform:'none',opacity:1});
    const txt='我可以要一份饺子吗？', n=Math.round(lerp(0,txt.length,p(t,54.0,55.4,E.lin)));
    L('u1zh').textContent=txt.slice(0,n); L('caret').style.opacity=t<55.45?(Math.floor(t*2.4)%2?.15:1):0;
    L('u1sub').textContent=t>55.5?'Can I get a plate of dumplings?':'';
  }
  // wipe + mascot burst into the phone 11.6–12.6
  const wl=p(t,11.62,11.95), wo=p(t,11.95,12.3);
  show(L('wipe'),t>11.6&&t<12.32); L('wipe').style.clipPath=`circle(${wl*1500}px at 600px 1260px)`; L('wipe').style.opacity=1-wo;
  const bm=t>11.6&&t<12.7; show(L('burstMas'),bm);
  if(bm){const m=p(t,11.6,12.0,E.back), f=p(t,12.2,12.65,E.inExpo); set(L('burstMas'),{transform:`translate(${(1-m)*60}px,${(1-m)*300-f*500}px) scale(${m*(1-f*.8)}) rotate(${lerp(-30,0,m)+f*25}deg)`,opacity:1-f});}

  // PHONE 12–53.5
  const phOn=t>11.9&&t<53.6; show(L('persp'),phOn); show(L('scrim'),phOn); L('scrim').style.opacity=p(t,11.9,12.5)*(1-p(t,53.0,53.5));
  if(phOn){
    [['sHome',11.9,21.2],['sGoal',13.5,17.95],['sReview',17.85,21.2],['sLesson',21.0,36.2],['sRole',36.0,54]].forEach(([id,a,b])=>show(L(id),t>=a&&t<b));
    const [S,fx,fy,cy]=camAt(t), enter=p(t,11.9,12.7,E.outExpo), exit=p(t,52.9,53.5,E.inExpo);
    set(cam,{transform:`translate(${540-S*(fx+12)}px,${cy-S*(fy+12)+(1-enter)*900-exit*1400}px) scale(${S})`});
    set(dev,{transform:`rotateX(${(1-enter)*30+Math.sin(t*.5)*1.8}deg) rotateY(${(1-enter)*-16+Math.sin(t*.4)*2.4}deg) rotateZ(${(1-enter)*6}deg)`,filter:`blur(${(1-enter)*14+exit*16}px)`});
    // 3. plan 12–21
    if(t<21.3){
      const gs=L('sGoal'), typed='Order dinner in Shanghai', n=Math.round(lerp(0,typed.length,p(t,14.8,16.6,E.lin)));
      const busy=t>17.2&&t<17.9, caret=t>14.6&&t<17.2, txt=typed.slice(0,n);
      // build once; per frame only the field text and button state change (rebuilding re-lays out emoji too late)
      if(!gs.dataset.built){gs.innerHTML=K.goalSheet({typed:'x',caret:false,busy:false});gs.dataset.built=1;K.icons();
        const pb=$('.gs-plan',gs); pb.insertAdjacentHTML('afterbegin','<span class="spin" style="width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;display:none"></span>');}
      const inp=$('.gs-input',gs), key=txt+'|'+caret;
      if(inp.dataset.k!==key){inp.dataset.k=key; inp.innerHTML=(txt||'e.g. Chat with my partner’s parents')+(caret?'<span style="display:inline-block;width:2px;height:18px;background:#2563EB;vertical-align:middle;margin-left:1px"></span>':'');}
      set(inp,{borderColor:txt?'#2563EB':'#ECE8E1',color:txt?'#12141A':'#9A9EA8',boxShadow:txt?'0 0 0 4px rgba(37,99,235,.12)':'none'});
      const pb=$('.gs-plan',gs); set(pb,{opacity:txt?1:.4}); K.show($('.spin',pb),busy); K.show($('.ic',pb),!busy);
      const sh=p(t,13.6,14.05), shOut=p(t,17.8,17.95);
      set($('.gs-sheet',gs),{transform:`translateY(${(1-sh)*600+shOut*40}px)`}); set($('.gs-bd',gs),{opacity:sh*(1-shOut)});
      const sp=$('.spin',gs); if(sp) sp.style.transform=`rotate(${t*720}deg)`;
      set($('#sReview .sheet'),{transform:`translateY(${(1-p(t,17.85,18.25))*80}px)`});
      $$('#sReview .gr-task').forEach((r,i)=>K.fadeIn(r,t,18.1+i*.25,.3));
    }
    // 4–5. lesson 21–36
    if(t>20.9&&t<36.3){
      K.fadeIn(L('lsItem'),t,21.5,.4);
      show(L('kar1'),t<24.3); show($('#sLesson .li-words'),t>=24.3);
      const ki=Math.floor((t-22.6)/.36); karSpans.forEach((s,i)=>s.classList.toggle('on',t>=22.6&&i<=ki));
      K.dockState(lsDock,t,t<24.3?'disabled':'idle',t<24.3?'Listen to your tutor...':'Tap the mic and say 我要这个');
      L('lsMas').innerHTML=mascot('happy',{mouth:(t>22.6&&t<24.1)?(1+Math.sin(t*40)*.15):1,blink:(t%3.7)<.12});
      const ws=p(t,29.6,30.05), wsOut=p(t,35.5,35.85);
      show(L('sWord'),t>29.55&&t<35.9); set($('#sWord .ws-sheet'),{transform:`translateY(${(1-ws)*700+wsOut*700}px)`}); set($('#sWord .ws-bd'),{opacity:ws*(1-wsOut)});
    }
    // 6–7. roleplay 36–53
    if(t>35.9){
      K.fadeIn(L('rpW1'),t,36.5,.35);
      const l1=L('rpL1'); show(l1,t>45.9); K.fadeIn(l1,t,45.9);
      K.learnerPhase($('.lwrap',l1)||l1, t<47.3?'dots':t<47.5?'text':t<48.1?'pend':t<48.9?'tog':t<51.3?'card':'saved');
      K.dotsAnim(L('sRole'),t);
      set(L('rpFeed'),{transform:`translateY(${-lerp(0,190,p(t,48.9,49.5))}px)`});
      const rec=t>45.85&&t<47.2;
      K.dockState(rpDock,t,rec?'rec':(t<37.6?'disabled':'idle'),rec?'Recording... speak your response, then tap stop.':t<37.6?'Tutor is speaking...':(t>47.2&&t<48.1)?'Checking your response...':'Your turn — record your response.');
      const hm=L('rpHelp'), hq=p(t,38.4,38.7), hOut=p(t,45.1,45.35);
      show(hm,t>38.38&&t<45.4); set(hm,{opacity:hq*(1-hOut)});
      const recH=t>39.05&&t<40.4, trans=t>=40.4&&t<41.0, res=t>=41.0;
      set($('.hm-rec',hm),{borderColor:recH?'#DC2626':'#ECE8E1',background:recH?'#FDEDED':'#EAF1FE'});
      const hb=$('.hm-btn',hm); set(hb,{background:recH?'#DC2626':'#2563EB'}); $('span:not(.ic)',hb).textContent=recH?'Stop':'Record';
      $('.hm-hint',hm).textContent=recH?'Recording in English... speak naturally, then tap stop.':trans?'Transcribing your English...':'Record your response in English then tap stop.';
      $('.hm-status',hm).textContent=trans?'Translating your reply...':(res||t>40.4)?'"Can I get the dumplings?"':'Record your idea in English and I\'ll help you say it naturally.';
      const r=$('.hm-result',hm); show(r,res); if(res) K.fadeIn(r,t,41.0,.35);
    }
    taps(t);
  } else { show(L('tap'),false); show(L('tapr'),false); }

  CAPS.forEach(c=>K.captionRender(c,t));
  // END CARD 57–60.5
  const eOn=t>57.0; show(L('endL'),eOn);
  if(eOn){
    const d=p(t,57.05,57.45,E.inExpo), sq=t>57.45?Math.sin(Math.PI*cl((t-57.45)/.35))*Math.exp(-(t-57.45)*3):0, bob=t>57.9?Math.sin((t-57.9)*3.5)*10:0;
    set(L('endMas'),{transform:`translateY(${(1-d)*-900+bob}px) scale(${1+sq*.18},${1-sq*.22})`,transformOrigin:'50% 100%',opacity:cl((t-57.05)/.1)});
    $$('#word span').forEach((l,i)=>{const q=p(t,57.5+i*.035,57.95+i*.035,E.outExpo);set(l,{transform:`translateY(${(1-q)*70}px)`,opacity:q,filter:`blur(${(1-q)*12}px)`});});
    const pq=p(t,57.9,58.3,E.back); set(L('pillw'),{transform:`translateX(-50%) scale(${lerp(.7,1,pq)})`,opacity:cl((t-57.9)/.12)}); set(L('pillbg'),{transform:`rotate(${t*110}deg)`});
    const cq=p(t,58.15,58.55,E.back); set(L('cta'),{transform:`translateX(-50%) translateY(${(1-cq)*60}px) scale(${1+bump(t,59.4,.4)*.05})`,opacity:cl((t-58.15)/.12)});
    K.fadeIn(L('badges'),t,58.5,.4);
  }
}
function taps(t){
  const T=[[13.4,'#sHome .hm-newplan'],[14.6,'#sGoal .gs-input'],[17.2,'#sGoal .gs-plan'],[20.7,'#sReview .gr-add'],
           [29.4,'#sLesson .li-words .wbtn:nth-child(3)'],[38.2,'#rpDock .q'],[39.0,'#rpHelp .hm-btn'],[40.35,'#rpHelp .hm-btn'],[45.0,'#rpHelp .modal > div:first-child'],
           [45.8,'#rpDock .mic'],[47.15,'#rpDock .mic'],[48.8,'#rpL1 .tog'],[51.2,'#rpL1 .ff-save']];
  let cur=null; for(const x of T){ if(t>x[0]-.55&&t<x[0]+.8) cur=x; }
  if(!cur){show(L('tap'),false);show(L('tapr'),false);return;}
  K.tapAt(L('tap'),L('tapr'),$(cur[1]),t,cur[0],{arrive:.5,hold:.35});
}
window.render=render; render(0);
</script>
