<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=block" rel="stylesheet">
<link rel="stylesheet" href="../../kit/kit.css">
<style>
html,body{width:1080px;height:1920px;overflow:hidden;background:#F4F6FC}
#stage{position:absolute;inset:0;overflow:hidden;font-family:'Plus Jakarta Sans',sans-serif}
#night{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,#1B2A5C 0%,#0E1530 55%,#090D1F 100%)}
.glow{position:absolute;border-radius:50%;filter:blur(110px)}
#persp{position:absolute;inset:0;perspective:2600px}
#cam{position:absolute;left:0;top:0;transform-origin:0 0}
.real{position:absolute;inset:0}
.classCard{position:absolute;left:110px;top:600px;width:860px;border-radius:48px;background:#fff;box-shadow:0 50px 110px -30px rgba(18,20,40,.28);padding:40px 46px}
.stu{width:92px;height:92px;border-radius:50%;background:#E9EBF1;display:flex;align-items:center;justify-content:center}
#clock{position:absolute;left:0;right:0;top:720px;text-align:center;color:#fff}
.cap.dark{color:#fff}.cap.dark .hl{color:#C6F24E}
</style></head><body>
<div id="stage">
  <div id="night"></div>
  <div class="glow" id="g1" style="width:900px;height:900px;background:#CFE0FF"></div>
  <div class="glow" id="g2" style="width:760px;height:760px;background:#E8FFB0"></div>

  <!-- 1. class -->
  <div class="real" id="classL">
    <div class="classCard" id="cls">
      <div class="row" style="justify-content:space-between"><div style="font-size:28px;font-weight:700;color:#9A9EA8;letter-spacing:2px">SPANISH 101 · THURSDAY</div><div id="usersIc"></div></div>
      <div style="margin-top:34px;background:#EEF0F4;border-radius:12px 40px 40px 40px;padding:28px 34px;display:inline-block"><div style="font-size:54px;font-weight:700">¿Alguien quiere hablar?</div><div style="font-size:30px;color:#5C6170;margin-top:6px">Anyone want to speak?</div></div>
      <div class="row" id="studs" style="gap:22px;margin-top:44px"></div>
    </div>
  </div>
  <!-- 2. 1:12 AM -->
  <div id="clock"><div id="moonIc" style="display:flex;justify-content:center"></div><div style="font-size:200px;font-weight:700;letter-spacing:-8px;line-height:1;margin-top:20px">1:12</div><div style="font-size:40px;font-weight:600;opacity:.6;margin-top:10px">Friday, AM</div></div>

  <div id="persp"><div id="cam"><div id="phoneWrap"></div></div></div>
  <div id="scrim" style="position:absolute;left:0;right:0;top:0;height:620px;background:linear-gradient(180deg,#121B3D 0%,#121B3D 70%,rgba(18,27,61,0) 100%);pointer-events:none"></div>
  <div class="layer" id="caps"></div>
  <div class="tap" id="tap"></div><div class="tapr" id="tapr"></div>
  <div class="layer" id="endL">
    <img id="endMas" src="../../kit/mascot.png" style="position:absolute;left:350px;top:520px;width:380px;height:380px">
    <div id="word" style="position:absolute;left:0;right:0;top:950px;text-align:center;font-size:132px;font-weight:800;letter-spacing:-6px;color:#fff"></div>
    <div id="pillw" style="position:absolute;left:50%;top:1130px;height:92px;border-radius:46px;padding:3px;overflow:hidden;box-shadow:0 18px 50px -10px rgba(37,99,235,.5)"><div id="pillbg" style="position:absolute;left:50%;top:50%;width:1000px;height:1000px;margin:-500px 0 0 -500px;background:conic-gradient(#2563EB,#B5F000,#F04070,#EAF1FE,#2563EB)"></div><div style="position:relative;height:86px;border-radius:43px;background:#fff;padding:0 44px;display:flex;align-items:center;font-size:34px;font-weight:700;white-space:nowrap">Speak a new language with confidence</div></div>
    <div id="cta" style="position:absolute;left:50%;top:1270px;height:116px;padding:0 70px;border-radius:58px;background:#2563EB;color:#fff;font-size:44px;font-weight:800;display:flex;align-items:center;gap:16px;white-space:nowrap;box-shadow:0 26px 50px -14px rgba(37,99,235,.6)">Start speaking free →</div>
    <div id="badges" class="row" style="position:absolute;left:0;right:0;top:1430px;justify-content:center;gap:24px"><img src="../../kit/brand/appstore-badge.svg" style="height:100px;display:block"><img src="../../kit/brand/googleplay-badge.svg" style="height:100px;display:block"></div>
  </div>
</div>
<script src="../../kit/lucide.min.js"></script>
<script src="../../kit/kit.js"></script>
<script>
const {p,E,set,show,$,$$,cl,lerp,bump,ic,mascot}=K;
// ---- Placement result (PlacementTestScreen ResultView) ----
const DIMS=[['Fluency',46],['Grammar',52],['Vocabulary',58],['Pronunciation',61],['Response Relevance',70]];
const placement=`<div class="scroll"><div class="largeTitle">Find your level</div>
  <div id="plScoring" class="col" style="align-items:center;gap:12px;margin-top:150px"><span class="dots"><i></i><i></i><i></i></span><div class="body" style="color:#5C6170">Scoring your answer…</div></div>
  <div id="plCard" class="card" style="margin-top:20px;padding:24px;display:flex;flex-direction:column;align-items:center;gap:8px">
    <div class="caption" style="font-weight:700;text-transform:uppercase;letter-spacing:.6px">Your level</div>
    <div class="row" style="align-items:flex-end;gap:4px"><div style="font-size:64px;line-height:70px;font-weight:800;color:#2563EB" id="plNum">3</div><div class="title" style="color:#9A9EA8;margin-bottom:12px">/ 10</div></div>
    <div class="title">High beginner</div><div class="caption" style="font-weight:700;color:#2563EB;margin-top:4px">A2</div>
    <div class="sub" style="text-align:center;margin-top:4px">You follow simple questions and answer in short phrases. Next step: longer replies.</div>
    <div style="align-self:stretch;margin-top:12px;display:flex;flex-direction:column;gap:4px">${DIMS.map(d=>`<div class="row"><div class="caption" style="width:92px;color:#5C6170">${d[0]}</div><div style="flex:1;height:6px;border-radius:3px;background:#F3F1EC;overflow:hidden"><div class="dimf" data-v="${d[1]}" style="height:100%;border-radius:3px;background:#2563EB;width:0"></div></div><div class="caption dimv" style="width:28px;text-align:right;color:#5C6170">${d[1]}</div></div>`).join('')}</div>
    <div class="btnP plApply" style="align-self:stretch;margin-top:12px;padding:12px 0;font-size:14px;font-weight:500">Apply &amp; start talking</div>
    <div style="font-size:14px;font-weight:500;color:#5C6170;padding:8px">Retake test</div>
  </div></div>`;
// ---- Lesson: listen → type → speak ----
const kar=(text,id)=>`<div class="kar" id="${id}" style="font-size:24px;line-height:32px">${text.split(' ').map(w=>`<span>${w}</span>`).join(' ')}</div>`;
const item=`<div class="kchip lime">PHRASE</div>
  <div class="row" style="align-items:flex-start;gap:6px"><div style="flex:1;font-size:16px;line-height:22px">Need the restroom? Ask this. The first word means "where", the next "is", and the last two mean "the bathroom".</div>${K.ic('speech',18,'#9A9EA8')}</div>
  <div class="row" style="gap:6px;margin-top:4px;margin-bottom:6px">${K.ic('repeat',14,'#2563EB')}<span class="lab12" style="color:#2563EB">REPEAT AFTER ME</span></div>
  ${kar('¿Dónde está el baño?','k1')}<div class="sub" style="font-weight:500">DOHN-deh ehs-TAH el BAH-nyoh</div><div class="body" style="margin-top:4px">Where is the bathroom?</div>
  <div class="tool"><div class="pa acc">${K.ic('volume-2',18,'#2563EB')}Listen</div><div class="pa mut">${K.ic('bookmark',18,'#12141A')}Save</div><div style="flex:1"></div>${K.ic('flag',18,'#9A9EA8')}</div>`;
const sw=(sel)=>K.answerSwitch(sel).replace('<div style="display:flex','<div class="asw" style="display:flex');
const listenDock=`<div id="dkListen" style="position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:20px 20px 0 0;box-shadow:var(--card);padding:12px 12px 30px;display:flex;flex-direction:column;gap:8px;z-index:20"><div class="sub" style="text-align:center">Listen as many times as you like, then move on.</div><div class="row" style="gap:8px"><div class="row" style="flex:1;justify-content:center;gap:6px;padding:12px 0;border-radius:999px;background:#EAF1FE;color:#2563EB;font-size:16px;font-weight:600">${K.ic('volume-2',18,'#2563EB')}Play again</div><div class="btnP" style="flex:1;padding:12px 0;font-size:16px">Next</div></div></div>`;
const typeDock=`<div id="dkType" style="position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:20px 20px 0 0;box-shadow:var(--card);padding:12px 12px 30px;display:flex;flex-direction:column;gap:8px;z-index:20"><div class="sub" style="text-align:center">Type the phrase you just heard.</div><div class="row" style="gap:8px"><div id="typeIn" style="flex:1;border-radius:999px;border:1px solid #ECE8E1;padding:10px 16px;font-size:16px;color:#9A9EA8">Type it in characters or pinyin</div><div class="btnP" id="chk" style="padding:12px 16px;font-size:16px">Check</div></div></div>`;
const nudge=K.tutorTurn(`<div class="body">You're typing these right. Ready to say the next one out loud?</div><div class="row" style="gap:8px;margin-top:12px"><div class="btnP" id="trySpk" style="padding:9px 18px;font-size:14px;font-weight:500">Try speaking</div><div style="padding:9px 12px;font-size:14px;font-weight:500;color:#2563EB">Not yet</div></div>`,{mood:'encourage'});
const lesson=`<div class="scroll" style="padding-bottom:0">${K.lessonHeader({title:'Getting Around',progress:['cur','none','none'],idx:1,total:3})}<div id="swWrap">${sw('Just listen')}</div></div>
  <div style="position:absolute;left:16px;right:16px;top:190px;bottom:150px;overflow:hidden"><div id="lfeed" style="position:relative;padding-top:6px;display:flex;flex-direction:column;gap:16px">
    <div id="it1">${K.tutorTurn(item,{mood:'happy',active:true})}</div>
    <div id="at1">${K.userAttempt({text:'¿Dónde está el baño?',verdict:'got'})}</div>
    <div id="nd">${nudge}</div>
    <div id="at2">${K.userAttempt({text:'¿Dónde está el baño?',verdict:'got'})}<div class="sub" style="text-align:right;margin-top:-4px">Nicely done!</div></div>
  </div></div>${listenDock}${typeDock}${K.micDock({step:'REPEAT AFTER ME',hint:'Tap the mic and say ¿Dónde está el baño?',menu:false,id:'mdock'})}`;
// ---- Recap (LessonRecapV2) ----
const badge=`<div class="row" style="gap:4px;padding:4px 8px;border-radius:999px;background:#E8F6EE;color:#15803D;font-size:12px;font-weight:600">${K.ic('check',12,'#15803D',2)}Nailed it</div>`;
const recap=`<div class="scroll" style="display:flex;flex-direction:column;gap:16px">
  <div class="row" style="gap:16px"><div style="width:84px;height:84px" id="rcMas">${mascot('celebrate')}</div><div><div class="eyebrow" style="color:#4D7C0F">LESSON COMPLETE</div><div class="title" style="margin-top:2px">Getting Around</div><div class="headline" style="color:#5C6170;margin-top:4px">You nailed 3 of 3</div></div></div>
  <div style="position:relative;background:#fff;border-radius:16px;padding:10px 14px;box-shadow:var(--card);font-size:15px;line-height:21px" id="rcBub">Every single one! You were on fire today.</div>
  <div class="cardB" style="padding:16px;display:flex;flex-direction:column;gap:8px" id="rcList"><div class="eyebrow">HOW EACH ONE WENT</div>
   ${[['¿Dónde está el baño?','Where is the bathroom?'],['¿Cuánto cuesta?','How much is it?'],['La cuenta, por favor.','The check, please.']].map(r=>`<div class="row rcRow" style="gap:12px;border-top:1px solid #ECE8E1;padding-top:8px"><div style="flex:1"><div style="font-size:16px;font-weight:600">${r[0]}</div><div style="font-size:13px;color:#5C6170">${r[1]}</div></div>${badge}</div>`).join('')}</div>
  <div class="btnP" style="padding:14px 0;font-size:15px">${K.ic('message-circle',17,'#fff')}Keep talking about this in Chat</div></div>`;
// ---- Progress (StatsCard + AchievementsList) ----
const tile=(icon,c,v,l,id)=>`<div class="card" style="flex:1;padding:16px 0;display:flex;flex-direction:column;align-items:center">${K.ic(icon,20,c)}<div ${id?`id="${id}"`:''} style="font-size:28px;font-weight:800;letter-spacing:-.5px;margin-top:8px">${v}</div><div class="caption">${l}</div></div>`;
const ach=(icon,label,desc,earned,id)=>`<div class="row" ${id?`id="${id}"`:''} style="gap:12px;padding:12px 0;border-top:1px solid #ECE8E1"><div class="achIc" style="width:36px;height:36px;border-radius:50%;background:${earned?'#EAF1FE':'#F3F1EC'};display:flex;align-items:center;justify-content:center">${K.ic(icon,18,earned?'#2563EB':'#9A9EA8')}</div><div style="flex:1"><div class="achL" style="font-size:15px;font-weight:600;color:${earned?'#12141A':'#9A9EA8'}">${label}</div><div class="caption">${desc}</div>${earned?'':`<div style="height:4px;border-radius:2px;background:#F3F1EC;margin-top:6px;overflow:hidden"><div class="achP" style="height:100%;width:86%;background:#2563EB"></div></div>`}</div><div class="achR">${earned?K.ic('circle-check',20,'#15803D'):K.ic('chevron-right',20,'#9A9EA8')}</div></div>`;
const progress=`<div class="scroll"><div class="largeTitle">Progress</div><div class="sub" style="margin:4px 0 14px">Your streaks, XP, and milestones.</div>
  <div class="row" style="gap:12px;margin-bottom:12px">${tile('flame','#B45309','7','Day streak','pgStreak')}${tile('sparkle','#2563EB','640','Total XP')}${tile('message-square-text','#15803D','42','Exchanges')}</div>
  <div class="card" style="padding:8px 16px"><div class="headline" style="padding:8px 0">Achievements</div>
   ${ach('star','First Steps','Complete your first exchange',true)}${ach('flame','On a Roll','3-day streak',true)}${ach('flame','Week Warrior','7-day streak',false,'ww')}${ach('book-open','Word Collector','Save 10 words',false)}</div></div>
  ${K.xpToast(['+40 XP','Week Warrior'],'xp').replace('top:136px','top:84px')}`;
$('#phoneWrap').innerHTML=K.device('dev',`<div class="layer" id="sPl">${placement}</div><div class="layer" id="sLs">${lesson}</div><div class="layer" id="sRc">${recap}</div><div class="layer" id="sPg">${progress}</div>`);
$('#usersIc').innerHTML=ic('users',40,'#9A9EA8',1.8); $('#moonIc').innerHTML=ic('moon',90,'#C6F24E',1.6);
$('#studs').innerHTML=[0,1,2,3,4].map(()=>`<div class="stu">${ic('user',44,'#B8BCC8',1.6)}</div>`).join('');
$('#word').innerHTML=[...'Polyspeech'].map(c=>`<span style="display:inline-block">${c}</span>`).join('');
K.icons(); K.preloadGlyphs('¿Dónde está el baño?');
const dev=$('#dev'), cam=$('#cam'), L=id=>$('#'+id), mdock=L('mdock');

const CAPS=[
 {a:.8,b:5.6,html:'Speaking up in class? | <b>Terrifying.</b>',light:true},
 {a:7.2,b:11.4,html:'So I practice where | <b>nobody’s listening.</b>'},
 {a:13.4,b:17.4,html:'Two minutes. | It finds <b>my level.</b>'},
 {a:22.0,b:26.0,html:'Start by listening. | Then <b>type.</b>'},
 {a:29.6,b:33.4,html:'When I’m ready, | <b>I speak.</b>'},
 {a:37.6,b:41.6,html:'No one judging. | Just <b>progress.</b>'},
 {a:44.6,b:48.4,html:'A little, | <b>every night.</b>'},
];
CAPS.forEach((c,i)=>{CAPS[i]=K.caption(L('caps'),{...c,style:{left:'50px',right:'50px',top:'230px',fontSize:'80px'}}); if(!c.light) CAPS[i].el.classList.add('dark');});
const KF=[[0,1.75,187,406,1170],[13.2,2.05,187,330,1110],[21.2,1.95,187,400,1150],[29.0,1.95,187,420,1150],[37.2,2.0,187,330,1110],[44.2,2.0,187,330,1110]];
function camAt(t){let i=0;while(i<KF.length-1&&KF[i+1][0]<=t)i++;const b=KF[i],a=KF[Math.max(0,i-1)];
  const q=E.inOut(cl((t-b[0])/.8));return b.slice(1).map((v,k)=>lerp(a[k+1],v,q));}
const SCROLL=[[0,'it1',0],[29.0,'it1',220],[34.4,'nd',-6]];
function feedY(t){let i=0;while(i<SCROLL.length-1&&SCROLL[i+1][0]<=t)i++;const off=e=>L(e[1]).offsetTop-6+(e[2]||0);
  return -lerp(off(SCROLL[Math.max(0,i-1)]),off(SCROLL[i]),E.inOut(cl((t-SCROLL[i][0])/.6)));}

function render(t){
  // background: day (class) → night from 6.4
  const nightQ=p(t,6.3,7.2,E.inOut)*(1-p(t,55,56)); L('night').style.opacity=nightQ;
  set(L('g1'),{left:(-260+Math.sin(t*.4)*80)+'px',top:(-160+Math.cos(t*.3)*60)+'px',opacity:.75-nightQ*.55});
  set(L('g2'),{left:(480+Math.cos(t*.35)*80)+'px',top:(1300+Math.sin(t*.45)*70)+'px',opacity:.6-nightQ*.45});
  // 1. class 0–6.5
  const cOn=t<6.8; show(L('classL'),cOn);
  if(cOn){const q=p(t,0,.7,E.back), out=p(t,6.0,6.6,E.inExpo); set(L('cls'),{transform:`translateY(${(1-q)*240-out*160}px) scale(${lerp(.88,1,q)})`,opacity:cl(t/.2)*(1-out),filter:`blur(${out*14}px)`});
    $$('#studs .stu').forEach((s,i)=>{const a=p(t,.9+i*.12,1.3+i*.12,E.back);set(s,{transform:`scale(${a})`});});}
  // 2. clock 6.6–12
  const kOn=t>6.6&&t<12.3; show(L('clock'),kOn);
  if(kOn){const q=p(t,6.8,7.6,E.outExpo), out=p(t,11.5,12.1,E.inExpo); set(L('clock'),{transform:`translateY(${(1-q)*80-out*240}px) scale(${1-out*.2})`,opacity:q*(1-out),filter:`blur(${out*14}px)`});}
  // 3–7. phone 11.8–50.4
  const phOn=t>11.8&&t<50.6; show(L('persp'),phOn); show(L('scrim'),phOn); L('scrim').style.opacity=p(t,11.8,12.4)*(1-p(t,49.8,50.3));
  if(phOn){
    [['sPl',11.8,20.9],['sLs',20.7,37.4],['sRc',37.2,44.4],['sPg',44.2,51]].forEach(([id,a,b])=>show(L(id),t>=a&&t<b));
    const [S,fx,fy,cy]=camAt(t), enter=p(t,11.8,12.6,E.outExpo), exit=p(t,49.7,50.4,E.inExpo);
    set(cam,{transform:`translate(${540-S*(fx+12)}px,${cy-S*(fy+12)+(1-enter)*900-exit*1400}px) scale(${S})`});
    set(dev,{transform:`rotateX(${(1-enter)*30+Math.sin(t*.5)*1.8}deg) rotateY(${(1-enter)*-16+Math.sin(t*.4)*2.4}deg) rotateZ(${(1-enter)*6}deg)`,filter:`blur(${(1-enter)*14+exit*16}px)`});
    // screen slide between sections
    [['sLs',20.7],['sRc',37.2],['sPg',44.2]].forEach(([id,a])=>set(L(id),{transform:`translateX(${(1-p(t,a,a+.55))*375}px)`}));
    // placement
    if(t<21){ show(L('plScoring'),t<13.4); show(L('plCard'),t>=13.4); K.dotsAnim(L('sPl'),t); K.fadeIn(L('plCard'),t,13.4,.4);
      $$('#sPl .dimf').forEach((f,i)=>f.style.width=(p(t,14.0+i*.18,14.8+i*.18,E.out)*f.dataset.v)+'%'); }
    // lesson
    if(t>20.6&&t<37.5){
      const typeMode=t>=23.7&&t<31.6, speakMode=t>=31.6;
      const swSel=speakMode?'Speak':typeMode?'Type':'Just listen'; const swW=L('swWrap'); if(swW.dataset.s!==swSel){swW.dataset.s=swSel; swW.innerHTML=sw(swSel); K.icons();}
      show(L('dkListen'),!typeMode&&!speakMode); show(L('dkType'),typeMode); show(mdock,speakMode);
      set(L('dkType'),{transform:`translateY(${(1-p(t,23.7,24.1))*120}px)`}); set(mdock,{transform:`translateY(${(1-p(t,31.6,32.0))*200}px)`});
      const typed='¿Dónde está el baño?', n=Math.round(lerp(0,typed.length,p(t,24.6,25.9,E.lin))), ti=L('typeIn');
      const tk=String(n); if(ti.dataset.k!==tk){ti.dataset.k=tk; ti.textContent=n?typed.slice(0,n):'Type it in characters or pinyin'; ti.style.color=n?'#12141A':'#9A9EA8'; ti.style.borderColor=n?'#2563EB':'#ECE8E1';}
      K.fadeIn(L('it1'),t,21.2,.35);
      const ki=Math.floor((t-21.6)/.52); $$('#k1 span').forEach((s,i)=>s.classList.toggle('on',t>=21.6&&i<=ki));
      show(L('at1'),t>26.4); K.fadeIn(L('at1'),t,26.4,.3); set($('#at1 .stamp'),{transform:`scale(${p(t,26.7,27.0,E.back)})`});
      show(L('nd'),t>29.2); K.fadeIn(L('nd'),t,29.2,.35);
      show(L('at2'),t>34.4); K.fadeIn(L('at2'),t,34.4,.3); set($('#at2 .stamp'),{transform:`scale(${p(t,34.7,35.0,E.back)})`});
      set(L('lfeed'),{transform:`translateY(${feedY(t)}px)`});
      const rec=t>32.85&&t<34.3; K.dockState(mdock,t,rec?'rec':'idle',rec?'Listening — say it, then tap stop.':(t>34.3&&t<34.5)?'Checking your pronunciation...':'Tap the mic and say ¿Dónde está el baño?');
      if(t>34.4){const seg=$$('#sLs .lh-prog > div > div'); if(seg[0]) seg[0].style.background='#B5F000';}
    }
    // recap
    if(t>37.1&&t<44.5){ const m=p(t,37.7,38.1,E.back); set(L('rcMas'),{transform:`scale(${m}) rotate(${lerp(-20,0,m)}deg)`}); K.fadeIn(L('rcBub'),t,38.2,.35);
      $$('#sRc .rcRow').forEach((r,i)=>K.fadeIn(r,t,38.8+i*.3,.3)); }
    // progress
    if(t>44.1){ const u=t>=45.8; const ww=L('ww'), key=String(u);
      if(ww.dataset.u!==key){ww.dataset.u=key; ww.outerHTML=ach('flame','Week Warrior','7-day streak',u,'ww'); K.icons();}
      const ww2=L('ww'); if(!u){const pr=$('.achP',ww2); if(pr) pr.style.width=(86+p(t,44.9,45.7)*14)+'%';}
      else set(ww2,{background:`rgba(181,240,0,${(1-p(t,46.4,47.4))*.18})`,transform:`scale(${1+bump(t,45.8,.35)*.04})`});
      const sk=L('pgStreak'); sk.textContent=t<45.6?'6':'7'; set(sk,{transform:`scale(${1+bump(t,45.6,.35)*.25})`});
      const xq=p(t,46.0,46.3,E.spring); set(L('xp'),{opacity:cl((t-46.0)/.2)*(1-p(t,48.4,48.7)),transform:`translateX(-50%) translateY(${(1-xq)*20}px)`}); }
    taps(t);
  } else { show(L('tap'),false); show(L('tapr'),false); }
  CAPS.forEach(c=>K.captionRender(c,t));
  // end card 50.3–54.8 (night)
  const eOn=t>50.3; show(L('endL'),eOn);
  if(eOn){
    const d=p(t,50.35,50.75,E.inExpo), sq=t>50.75?Math.sin(Math.PI*cl((t-50.75)/.35))*Math.exp(-(t-50.75)*3):0, bob=t>51.2?Math.sin((t-51.2)*3.5)*10:0;
    set(L('endMas'),{transform:`translateY(${(1-d)*-900+bob}px) scale(${1+sq*.18},${1-sq*.22})`,transformOrigin:'50% 100%',opacity:cl((t-50.35)/.1)});
    $$('#word span').forEach((l,i)=>{const q=p(t,50.8+i*.035,51.25+i*.035,E.outExpo);set(l,{transform:`translateY(${(1-q)*70}px)`,opacity:q,filter:`blur(${(1-q)*12}px)`});});
    const pq=p(t,51.2,51.6,E.back); set(L('pillw'),{transform:`translateX(-50%) scale(${lerp(.7,1,pq)})`,opacity:cl((t-51.2)/.12)}); set(L('pillbg'),{transform:`rotate(${t*110}deg)`});
    const cq=p(t,51.45,51.85,E.back); set(L('cta'),{transform:`translateX(-50%) translateY(${(1-cq)*60}px) scale(${1+bump(t,52.8,.4)*.05})`,opacity:cl((t-51.45)/.12)});
    K.fadeIn(L('badges'),t,51.8,.4);
  }
}
function taps(t){
  const T=[[19.6,'#sPl .plApply'],[23.6,'#swWrap .asw > div > div:nth-child(2)'],[26.2,'#chk'],[31.4,'#trySpk'],[32.8,'#mdock .mic'],[34.25,'#mdock .mic']];
  let cur=null; for(const x of T){ if(t>x[0]-.55&&t<x[0]+.8) cur=x; }
  if(!cur){show(L('tap'),false);show(L('tapr'),false);return;}
  K.tapAt(L('tap'),L('tapr'),$(cur[1]),t,cur[0],{arrive:.5,hold:.35});
}
window.render=render; render(0);
</script>
